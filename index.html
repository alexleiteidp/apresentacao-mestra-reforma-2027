<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reforma tributária na advocacia: a conta de 2027</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; padding: 24px; background: #f1ede3; color: #10262b; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
main { width: 100%; max-width: 460px; background: #fbf9f4; border: 1px solid #d9d6cb; border-radius: 16px; padding: 36px 34px 30px; box-shadow: 0 18px 50px rgba(16, 38, 43, 0.10); }
small { color: #0d5f60; font-weight: 600; letter-spacing: 0.02em; }
h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.2; margin: 10px 0 8px; }
p { margin: 0 0 22px; color: #33474b; line-height: 1.5; }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; border: 1px solid #9fb0ac; border-radius: 10px; background: #fff; color: inherit; }
button { width: 100%; margin-top: 14px; font: inherit; font-size: 17px; font-weight: 600; padding: 13px; border: 0; border-radius: 10px; background: #0d5f60; color: #fff; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: wait; }
input:focus-visible, button:focus-visible { outline: 3px solid #1c6c98; outline-offset: 2px; }
#msg { min-height: 1.5em; margin: 14px 0 0; font-size: 15px; color: #a3283a; }
footer { margin-top: 18px; font-size: 13px; color: #55686b; }
</style>
</head>
<body>
<main>
  <small>Minicurso em doze módulos</small>
  <h1>Reforma tributária na advocacia: a conta de 2027</h1>
  <p>Alexander Andrade Leite, advogado tributarista. Digite a senha para abrir a apresentação.</p>
  <form id="f">
    <label for="s">Senha</label>
    <input id="s" type="password" autocomplete="current-password" required autofocus>
    <button id="b">Entrar</button>
    <p id="msg" role="alert"></p>
  </form>
  <footer>Conteúdo informativo; números de escritórios fictícios.</footer>
</main>
<script>
(function () {
  "use strict";
  const SAL = "zZm3DGFIdg/UdwZ3RwHEvQ==", ITER = 600000, BANCO = "apresentacao-protegida";
  const $ = (id) => document.getElementById(id), msg = (t) => { $("msg").textContent = t; };
  if (!("serviceWorker" in navigator) || !window.crypto || !crypto.subtle || !window.indexedDB) {
    $("b").disabled = true; msg("Este navegador não consegue abrir a apresentação. Use o Chrome ou o Edge atualizados, fora do modo anônimo.");
    return;
  }
  const registro = navigator.serviceWorker.register("sw.js");
  const guardar = (v) => new Promise((ok, erro) => {
    const p = indexedDB.open(BANCO, 1);
    p.onupgradeneeded = () => p.result.createObjectStore("kv");
    p.onerror = () => erro(p.error);
    p.onsuccess = () => { const t = p.result.transaction("kv", "readwrite"); t.objectStore("kv").put(v, "estado"); t.oncomplete = () => { p.result.close(); ok(); }; t.onerror = () => erro(t.error); };
  });
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("b").disabled = true; msg("");
    try {
      const sal = Uint8Array.from(atob(SAL), (c) => c.charCodeAt(0));
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode($("s").value.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
      const chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: sal, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const b = new Uint8Array(await (await fetch("d/mapa.bin")).arrayBuffer());
      let mapa;
      try { mapa = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, chave, b.slice(12)))); }
      catch (erro) { msg("Senha incorreta."); $("b").disabled = false; $("s").select(); return; }
      await guardar({ chave, mapa });
      await registro; await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) await new Promise((ok) => { navigator.serviceWorker.addEventListener("controllerchange", ok, { once: true }); setTimeout(ok, 3000); });
      if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("recarregar");
      location.reload();
    } catch (erro) {
      msg("Não foi possível abrir. Verifique a conexão e tente de novo."); $("b").disabled = false;
    }
  });
})();
</script>
</body>
</html>
